# WezTerm reports TERM=wezterm, which the xterm* pattern does not match, so
# without this tmux falls back to 256 colours.
set-option -ga terminal-overrides ",wezterm:RGB,xterm*:Tc"
set -ga terminal-features "*:hyperlinks"

set -g mouse on

# Enable vi mode for copy mode
set -g mode-keys vi

# Vi-style copy mode bindings (more vim-like)
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

set -g @tmux-dotbar-right true
set -g @tmux-dotbar-status-right-text " #{cpu} | #{mem -t} | #(disk-usage) "

set -g @tmux-dotbar-position top
set -g @tmux-dotbar-bg "#000000"
set -g @tmux-dotbar-fg-prefix "#98c379"
set -g status-left-length 30

# Switch to last session with Ctrl-b l (no shift needed)
bind-key l switch-client -l

# prefix + number switches session (unbind default window-select)
unbind 0
unbind 1
unbind 2
unbind 3
unbind 4
unbind 5
unbind 6
unbind 7
unbind 8
unbind 9
bind-key 0 run-shell "~/.config/tmux/switch-session-by-index.sh 0"
bind-key 1 run-shell "~/.config/tmux/switch-session-by-index.sh 1"
bind-key 2 run-shell "~/.config/tmux/switch-session-by-index.sh 2"
bind-key 3 run-shell "~/.config/tmux/switch-session-by-index.sh 3"
bind-key 4 run-shell "~/.config/tmux/switch-session-by-index.sh 4"
bind-key 5 run-shell "~/.config/tmux/switch-session-by-index.sh 5"
bind-key 6 run-shell "~/.config/tmux/switch-session-by-index.sh 6"
bind-key 7 run-shell "~/.config/tmux/switch-session-by-index.sh 7"
bind-key 8 run-shell "~/.config/tmux/switch-session-by-index.sh 8"
bind-key 9 run-shell "~/.config/tmux/switch-session-by-index.sh 9"

# fzf session switcher (Ctrl-b s), default session list moved to Ctrl-b S
bind-key s display-popup -E -w 40 -h 20 "~/.config/tmux/fzf-switch-session.sh"
bind-key S choose-tree -Zs

# Terminals can't pass Cmd through, so WezTerm turns Hyper (Ctrl+Opt+Cmd)
# + key into these custom sequences (see hyper_tmux_keys in .wezterm.lua)
set -s user-keys[0] "\e[hyper-q~"
set -s user-keys[1] "\e[hyper-w~"
set -s user-keys[2] "\e[hyper-e~"
set -s user-keys[3] "\e[hyper-r~"
set -s user-keys[4] "\e[hyper-t~"
set -s user-keys[5] "\e[hyper-y~"
set -s user-keys[6] "\e[hyper-u~"
set -s user-keys[7] "\e[hyper-i~"
set -s user-keys[8] "\e[hyper-o~"
set -s user-keys[9] "\e[hyper-p~"
set -s user-keys[10] "\e[hyper-z~"
set -s user-keys[11] "\e[hyper-x~"
set -s user-keys[12] "\e[hyper-c~"
set -s user-keys[13] "\e[hyper-v~"

bind -n User0 select-window -t 1
bind -n User1 select-window -t 2
bind -n User2 select-window -t 3
bind -n User3 select-window -t 4
bind -n User4 select-window -t 5
bind -n User5 select-window -t 6
bind -n User6 select-window -t 7
bind -n User7 select-window -t 8
bind -n User8 select-window -t 9
bind -n User9 select-window -t 10

bind -n User10 select-pane -t 1
bind -n User11 select-pane -t 2
bind -n User12 select-pane -t 3
bind -n User13 select-pane -t 4

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-option -g set-titles on
set-option -g automatic-rename on

# Jump to previous/next command prompt (searches for ❯ character)
# Search backward twice to skip current prompt
bind-key P copy-mode \; send-keys -X search-backward "❯" \; send-keys -X search-again

# Bind F12 (triggered by Cmd+Shift+N in WezTerm) to run tmux-pick
bind-key -n F12 run-shell "tmux neww tmux-pick"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
